name: CI Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: ☕ JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🔧 Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 🏗️ 빌드
        run: ./gradlew build

      - name: 📊 테스트 결과 요약
        if: always()
        run: |
          echo "## 🧪 테스트 결과" >> $GITHUB_STEP_SUMMARY
          if [ -f build/reports/tests/test/index.html ]; then
            echo "✅ 테스트 리포트가 생성되었습니다." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ 테스트 리포트를 찾을 수 없습니다." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📁 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7
